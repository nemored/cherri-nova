name: Nova CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  EXTENSION_BUNDLE: Cherri.novaextension
  ARTIFACT_ROOT: artifact

jobs:
  validate:
    name: Validate Extension
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nova
        shell: bash
        run: |
          set -euo pipefail
          brew list --cask nova >/dev/null 2>&1 || brew install --cask nova

      - name: Resolve Nova CLI
        id: nova
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${NOVA_CLI:-}" && -x "${NOVA_CLI}" ]]; then
            cli="${NOVA_CLI}"
          elif command -v nova >/dev/null 2>&1; then
            cli="$(command -v nova)"
          elif [[ -x "/Applications/Nova.app/Contents/SharedSupport/nova" ]]; then
            cli="/Applications/Nova.app/Contents/SharedSupport/nova"
          else
            echo "Nova CLI was not found. Install Nova and expose its CLI as 'nova', or set NOVA_CLI." >&2
            exit 1
          fi

          echo "cli=${cli}" >> "${GITHUB_OUTPUT}"
          "${cli}" --version

      - name: Validate manifest JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "${EXTENSION_BUNDLE}/extension.json" >/dev/null

      - name: Validate required Extension Library metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import pathlib
          import sys

          bundle = pathlib.Path("Cherri.novaextension")
          manifest = json.loads((bundle / "extension.json").read_text())

          required_manifest_fields = [
              "identifier",
              "name",
              "organization",
              "description",
              "version",
              "categories",
              "homepage",
              "bugs",
              "license",
          ]
          required_bundle_files = [
              "README.md",
              "CHANGELOG.md",
              "LICENSE.md",
              "extension.png",
              "extension@2x.png",
          ]

          missing_fields = [field for field in required_manifest_fields if not manifest.get(field)]
          missing_files = [path for path in required_bundle_files if not (bundle / path).is_file()]

          if missing_fields or missing_files:
              if missing_fields:
                  print(f"Missing extension.json fields: {', '.join(missing_fields)}", file=sys.stderr)
              if missing_files:
                  print(f"Missing bundle files: {', '.join(missing_files)}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Validate with Nova
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.nova.outputs.cli }}" extension validate "${EXTENSION_BUNDLE}"

      - name: Stage extension bundle artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ARTIFACT_ROOT}"
          ditto --norsrc --noextattr "${EXTENSION_BUNDLE}" "${ARTIFACT_ROOT}/${EXTENSION_BUNDLE}"

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cherri.novaextension
          path: ${{ env.ARTIFACT_ROOT }}/*
          if-no-files-found: error
